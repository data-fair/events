name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # vue-tsc needs the .d.ts files generated by the UI build
    - name: Lint, build and type-check
      run: npm run lint && npm run build-types && npm -w ui run build && npm run check-types

    # only the browser binaries are cached, keyed on the installed playwright version;
    # the system packages they need are installed on every run
    - name: Read the playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache playwright browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Init env
      run: ./node_modules/.bin/df-dev init-env # local bin only: a bare npx would fetch an unrelated "df-dev" from the registry if the dependency were missing

    # the runner checks out a detached HEAD, so DEV_HOST is derived from the
    # literal "HEAD"; force a plain lowercase host so simple-directory's site url
    # matches the (lowercased) request host
    - name: Use localhost as DEV_HOST in CI
      run: sed -i 's/^DEV_HOST=.*/DEV_HOST=localhost/' .env

    - name: Start dev dependencies
      run: docker compose --profile '*' up -d --wait

    # the pane commands of .zellij.kdl, without nodemon
    - name: Start dev API and UI
      run: |
        mkdir -p dev/logs
        set -a; source .env; set +a
        (cd api && NODE_ENV=development node index.ts > ../dev/logs/api.log 2>&1 &)
        (cd ui && NODE_CONFIG_DIR=../api/config/ ../node_modules/.bin/vite --port $DEV_UI_PORT > ../dev/logs/ui.log 2>&1 &)

    - name: Wait for the dev API and UI to be ready
      run: |
        set -a; source .env; set +a
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${DEV_API_PORT}/api/ping" >/dev/null \
            && curl -sf "http://localhost:${DEV_UI_PORT}/events/" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "dev API or UI did not become ready" >&2
        tail -n 50 dev/logs/*.log
        exit 1

    # one job while the whole suite stays well under ~10 min (tooling.md "CI test jobs")
    - name: Run tests
      run: npm test

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical
