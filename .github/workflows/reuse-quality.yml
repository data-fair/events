name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # vue-tsc needs the .d.ts files generated by the UI build
    - name: Lint, build and type-check
      run: npm run lint && npm run build-types && npm -w ui run build && npm run check-types

    # only the browser binaries are cached, keyed on the installed playwright version;
    # the system packages they need are installed on every run
    - name: Read the playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache playwright browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Init .env
      run: cp dev/default.env .env

    # every later step gets the variables of .env, as npm run dev exports them to its processes
    - name: Export .env to the next steps
      run: cat .env >> "$GITHUB_ENV"

    # every profile (maildev included); the build above leaves dev-setup nothing to build
    - name: Start dev dependencies
      run: npm run dev-deps -- --profile '*'

    # the processes of npm run dev, logs in dev/logs for the upload below
    - name: Start dev API and UI
      run: |
        mkdir -p dev/logs
        npm run dev:api > dev/logs/api.log 2>&1 &
        npm run dev:ui > dev/logs/ui.log 2>&1 &

    - name: Wait for the dev API and UI to be ready
      run: |
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${DEV_API_PORT}/api/ping" >/dev/null \
            && curl -sf "http://localhost:${DEV_UI_PORT}/events/" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "dev API or UI did not become ready" >&2
        tail -n 50 dev/logs/*.log
        exit 1

    # one job while the whole suite stays well under ~10 min (tooling.md "CI test jobs")
    - name: Run tests
      run: npm test

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical
